name: cropmodel
description: "Corp Meal Project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  dio: ^5.9.1
  pretty_dio_logger: ^1.4.0
  flutter_easyloading: ^3.0.5
  flutter_screenutil: ^5.9.3
  easy_localization: ^3.0.8
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0
  extended_image: ^10.0.1
  image: ^4.8.0
  image_picker: ^1.2.1
  image_cropper: ^12.1.1
  permission_handler: ^12.0.1
  get_it: ^9.2.1
  google_maps_flutter: ^2.14.2
  cached_network_image: ^3.4.1
  equatable: ^2.0.8
  shimmer: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Move this out of the dev_dependencies indentation
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/images/
    - assets/fonts/
    - assets/data/restaurants.json

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-SemiBold.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf